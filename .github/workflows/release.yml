name: CI & Release
on:
    # Feature branches run CI through their pull request, so a push does not run it twice.
    push:
        branches:
            - main
            - alpha
            - beta
            - rc
            - canary
    # Title edits are checked by pull-request-title-check.yml and change no commit.
    pull_request:
        types:
            - opened
            - reopened
            - synchronize

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    # Never cancel a release halfway through publishing; queue the next push instead.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Pull requests check their commits; pushes check what they add, which covers direct pushes to release branches.
    # It does not block the release: a pushed commit cannot be rewritten, and it releases nothing when its header is invalid.
    commits:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 26
            - run: bun install --frozen-lockfile
            - run: bun run build
            - if: ${{ github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000' }}
              run: bun run aronrepo check --from "$BASE_SHA" --to "$HEAD_SHA"
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 26
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-${{ github.ref_name }}-
                      ${{ runner.os }}-turbo-
            - run: bun install --frozen-lockfile
            - run: bun run lint

    type-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 26
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-${{ github.ref_name }}-
                      ${{ runner.os }}-turbo-
            - run: bun install --frozen-lockfile
            - run: bun run type-check

    test:
        runs-on: ${{ matrix.os }}
        strategy:
            # One platform failing must not cancel the others, so every failure shows in one run.
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                node: [26]
                # The published package supports Node >=22.18 (`engines`); the LTS lines run on Ubuntu.
                include:
                    - os: ubuntu-latest
                      node: 22
                    - os: ubuntu-latest
                      node: 24
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: ${{ matrix.node }}
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: .turbo/cache
                  # Turbo does not hash the Node version, so each version keeps its own cache instead of replaying another's tests.
                  key: ${{ runner.os }}-node${{ matrix.node }}-turbo-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-node${{ matrix.node }}-turbo-${{ github.ref_name }}-
                      ${{ runner.os }}-node${{ matrix.node }}-turbo-
            - run: bun install --frozen-lockfile
            - run: bun run test

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 26
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-${{ github.ref_name }}-
                      ${{ runner.os }}-turbo-
            - run: bun install --frozen-lockfile
            - run: bun run build

    release:
        needs:
            - lint
            - type-check
            - test
            - build
        if: ${{ github.event_name == 'push' && contains(fromJSON('["main","alpha","beta","rc","canary"]'), github.ref_name) }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 26
            # No turbo cache: the job that holds publish credentials builds from source, never from what another job saved.
            # No install scripts: nothing from a dependency runs next to the npm and GitHub tokens.
            - run: bun install --frozen-lockfile --ignore-scripts
            - run: bun run build
            - run: bun run aronrepo explain
            - run: bun run aronrepo release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
