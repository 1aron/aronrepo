name: CI & Release
on:
    push:
        branches:
            - "**"
    pull_request:
        types:
            - opened
            - reopened
            - edited
            - synchronize

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    commits:
        if: ${{ github.event_name == 'pull_request' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-node@v6
              with:
                  node-version: 26
            - run: bun install --frozen-lockfile
            - run: bun run build
            - run: bun run aronrepo check --from "$BASE_SHA" --to "$HEAD_SHA"
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-node@v6
              with:
                  node-version: 26
            - uses: actions/cache@v6
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-${{ github.ref_name }}-
                      ${{ runner.os }}-turbo-
            - run: bun install --frozen-lockfile
            - run: bun run lint

    type-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-node@v6
              with:
                  node-version: 26
            - uses: actions/cache@v6
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-${{ github.ref_name }}-
                      ${{ runner.os }}-turbo-
            - run: bun install --frozen-lockfile
            - run: bun run type-check

    test:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-node@v6
              with:
                  node-version: 26
            - uses: actions/cache@v6
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-${{ github.ref_name }}-
                      ${{ runner.os }}-turbo-
            - run: bun install --frozen-lockfile
            - run: bun run test

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-node@v6
              with:
                  node-version: 26
            - uses: actions/cache@v6
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-${{ github.ref_name }}-
                      ${{ runner.os }}-turbo-
            - run: bun install --frozen-lockfile
            - run: bun run build

    release:
        needs:
            - lint
            - type-check
            - test
            - build
        if: ${{ github.event_name == 'push' && contains(fromJSON('["main","alpha","beta","rc","canary"]'), github.ref_name) }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-node@v6
              with:
                  node-version: 26
            - uses: actions/cache@v6
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-${{ github.ref_name }}-
                      ${{ runner.os }}-turbo-
            - run: bun install --frozen-lockfile
            - run: bun run build
            - run: bun run aronrepo explain
            - run: bun run aronrepo release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
